# Corre las pruebas del backend en cada push y en cada pull request.
# Si alguna prueba falla, GitHub marca el commit/PR con una X roja.
name: Backend - pruebas

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permiso al Maven Wrapper
        run: chmod +x mvnw

      # OdontoSystemApplicationTests necesita la base de datos real (Supabase) y Redis,
      # que no se exponen en GitHub; se excluye aqui y se sigue corriendo en local.
      - name: Compilar y correr las pruebas
        run: ./mvnw -B clean test "-Dtest=!OdontoSystemApplicationTests" "-Dsurefire.failIfNoSpecifiedTests=false"

      - name: Guardar el reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco/
