spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework.security=INFO
# ============================================================
# Aplicaci\u00f3n
# ============================================================
spring.application.name=OdontoSystem
server.port=8080

# ============================================================
# Base de datos (Supabase / PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gobierna el script SQL v9, NO Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# Jackson (serializaci\u00f3n JSON)
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ============================================================
# Thymeleaf (solo plantillas de correo, no vistas web)
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

# ============================================================
# Correo (SMTP) \u2014 usado junto con Thymeleaf para las plantillas
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Redis (Upstash) \u2014 bloqueo temporal de slots de citas
# ============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ============================================================
# JWT propio (sesiones_usuario)
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=30

# ============================================================
# Google OAuth (verificaci\u00f3n de ID token \u2014 RF16)
# ============================================================
app.google.client-id=${GOOGLE_CLIENT_ID}

# ------------------------------------------------------------------
# Flyway: V1 (esquema v9) y V2 (tokens_refresco) ya existen en Supabase,
# por eso el baseline es 2 y solo se ejecutan las migraciones nuevas.
# ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Pocas conexiones: el plan gratuito de Supabase tiene un limite bajo
spring.datasource.hikari.maximum-pool-size=5
