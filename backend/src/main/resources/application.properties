spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework.security=INFO
# ============================================================
# Aplicaci\u00f3n
# ============================================================
spring.application.name=OdontoSystem
# Railway asigna el puerto con la variable PORT; en local se usa 8080
server.port=${PORT:8080}
# Railway recibe el trafico en https y lo pasa a la app en http: con esto la app
# lee los encabezados X-Forwarded-* y sabe que la URL publica es https (lo usa Swagger).
server.forward-headers-strategy=framework

# ============================================================
# Base de datos (Supabase / PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gobierna el script SQL v9, NO Hibernate
spring.jpa.hibernate.ddl-auto=validate
# (dialecto: Hibernate lo detecta solo; PostgisPG95Dialect estaba deprecado)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# Jackson (serializaci\u00f3n JSON)
# ============================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ============================================================
# Thymeleaf (solo plantillas de correo, no vistas web)
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

# ============================================================
# Correo (SMTP) \u2014 usado junto con Thymeleaf para las plantillas
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Redis (Upstash) \u2014 bloqueo temporal de slots de citas
# ============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ============================================================
# JWT propio (sesiones_usuario)
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=30

# ============================================================
# Google OAuth (verificaci\u00f3n de ID token \u2014 RF16)
# ============================================================
app.google.client-id=${GOOGLE_CLIENT_ID}

# ------------------------------------------------------------------
# Flyway: V1 (esquema v9) y V2 (tokens_refresco) ya existen en Supabase,
# por eso el baseline es 2 y solo se ejecutan las migraciones nuevas.
# ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Pocas conexiones: el plan gratuito de Supabase tiene un limite bajo
spring.datasource.hikari.maximum-pool-size=5
# Supabase cierra las conexiones que quedan inactivas unos minutos. Sin esto, la siguiente
# peticion tiene que abrir una conexion nueva hasta Sao Paulo (2-3 s) y aparece en el log
# "Failed to validate connection ... This connection has been closed".
#  - keepalive-time: cada 60 s hace un ping a las conexiones libres para que no se cierren.
#  - max-lifetime: renueva cada conexion antes de 5 min, por debajo del limite del servidor.
#  - minimum-idle: mantiene 2 conexiones listas en lugar de abrir una al llegar la peticion.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.minimum-idle=2
#  - idle-timeout: cierra conexiones libres sobrantes; debe ser menor que max-lifetime.
spring.datasource.hikari.idle-timeout=240000

# ------------------------------------------------------------------
# CORS: direcciones de los frontends que pueden llamar a la API.
# En Railway se define CORS_ALLOWED_ORIGINS con las URLs de Vercel, separadas por coma.
# ------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8080}

# ------------------------------------------------------------------
# Swagger / OpenAPI
#  - Interfaz:      /swagger-ui.html
#  - JSON crudo:    /v3/api-docs
# ------------------------------------------------------------------
# Encendido por defecto (lo usan Nicole y el profesor para ver el contrato).
# Para apagarlo en Railway: variable SWAGGER_ENABLED=false (sin tocar codigo).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ------------------------------------------------------------------
# Cloudinary: fotos de perfil, documentos (privados) y fotos del consultorio.
# Sin estas variables la app arranca igual, pero la subida responde 503.
# ------------------------------------------------------------------
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ------------------------------------------------------------------
# Salud (/actuator/health) para el healthcheck de Railway.
# Solo se expone health; Redis y correo no cuentan para no tumbar el despliegue si fallan.
# ------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.health.mail.enabled=false

# ------------------------------------------------------------------
# Pagos: "simulado" mientras no esten las llaves de Culqi (sandbox)
# ------------------------------------------------------------------
app.pagos.modo=${PAGOS_MODO:simulado}

# Tamano maximo de archivo: 5 MB (la peticion completa, 6 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Deja que Tomcat lea el cuerpo rechazado para poder responder 413 en lugar de cortar la conexion
server.tomcat.max-swallow-size=10MB
